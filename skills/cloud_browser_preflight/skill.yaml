  needs_review: false
  rationale: 'The same shape failed repeatedly in the window. WoWo registration returned 429 then 403 on every load for about 1.5 hours of reloads while the assistant promised to keep trying until it worked. The Monad Alchemy faucet captcha failed 5 times with the Send button staying disabled. The Tzero connect button was clicked 6 times with no wallet extension in the cloud browser, and the Superbridge bridge failed the same way. Faucet claims failed across five providers for the same wallet, captcha, and login reasons. The Lobinhood game was described as being tested before it had loaded, then crashed at 97 percent loading and no screenshot ever reached the assistant. The load_evidence rollup records 33 terminal subagent and tool failures, many of them browser_open failures. No existing skill covers this: muse.skill_search for browser captcha, wallet extension pre-flight, faucet claiming, and transient key signing returned no matching skill, and there are 0 custom skills. The proposed skill changes the mechanism directly: check the blocker before claiming work, prove the page loaded before reporting progress, treat deterministic blocks as unretryable after one failed attempt plus one different check, allow fresh captcha attempts up to five, and hand over with one exact user-device step. The custom.x connector doc was checked and is still an unfilled template, but it is not marked managed in the inventory, so it is out of scope for this loop and is not proposed here.'
